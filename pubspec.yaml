name: posts_hive_app
description: "Offline-First Flutter app with local NoSQL caching using Hive."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client for fetching posts from the API.
  http: ^1.1.0

  # Hive local database for offline-first caching.
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Connectivity detection for online/offline state.
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation for Hive TypeAdapters.
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true